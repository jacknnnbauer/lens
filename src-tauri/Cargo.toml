[package]
name = "lens"
version = "0.36.0"
description = "词镜 Lens：本地优先、键盘优先的桌面查词工具"
edition = "2021"
license = "MIT"
repository = "https://github.com/jacknnnbauer/lens"

[lib]
# The `_lib` suffix avoids a name clash between the lib and the bin on Windows
# (https://github.com/rust-lang/cargo/issues/8519).
name = "lens_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
cc = "1.6.0"
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
fst = { version = "0.4.7", features = ["levenshtein"] }
memmap2 = "0.9.11"
unicode-normalization = "0.1.25"
uuid = { version = "1.27.0", features = ["v4"] }
flate2 = "1.1.10"
ripemd = "0.2.0"
encoding_rs = "0.8.42"
lzokay-native = "0.1.0"
tauri-plugin-dialog = "2.8.1"
percent-encoding = "2.3.2"
tokio = { version = "1.53.2", features = ["sync", "rt", "time"] }
ogg = "0.9.2"
icu_segmenter = "2.3.0"
tauri-plugin-global-shortcut = "2.4.0"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
async-trait = "0.1.92"
url = "2.5.8"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls", "gzip"] }
base64 = "0.23.1"
tauri-plugin-single-instance = "2.5.2"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
roxmltree = "0.21"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.53.2", features = ["macros", "rt"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# 不用 abort：某个命令里的 bug（如义项图谱切错字符边界）只让这次操作失败，不让整个程序闪退
panic = "unwind"
strip = true

[target.'cfg(windows)'.dependencies]
# 与 Tauri/wry 使用的版本一致，用于 WebView2 PrintToPdf
webview2-com = "0.39.1"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Security_Credentials",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Power",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Accessibility",
  "Win32_UI_Controls",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
