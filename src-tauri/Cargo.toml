[package]
name = "lens"
version = "0.1.0"
description = "词镜 Lens：本地优先、键盘优先的桌面查词工具"
edition = "2021"

[lib]
# The `_lib` suffix avoids a name clash between the lib and the bin on Windows
# (https://github.com/rust-lang/cargo/issues/8519).
name = "lens_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
cc = "1.6.0"
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
fst = { version = "0.4.7", features = ["levenshtein"] }
memmap2 = "0.9.11"
unicode-normalization = "0.1.25"
uuid = { version = "1.27.0", features = ["v4"] }
flate2 = "1.1.10"
ripemd = "0.2.0"
encoding_rs = "0.8.42"
lzokay-native = "0.1.0"
tauri-plugin-dialog = "2.8.1"
percent-encoding = "2.3.2"
tokio = { version = "1.53.2", features = ["sync", "rt"] }
ogg = "0.9.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
